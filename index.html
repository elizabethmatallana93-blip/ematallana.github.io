            --medium-gray: #666666;
            --light-bg: #F8F9FA;
            --white: #FFFFFF;
            --shadow: 0 10px 30px rgba(0,0,0,0.1);
            --soft-shadow: 0 4px 15px rgba(0,0,0,0.05);

        html { scroll-behavior: smooth; }
        body { font-family: 'Roboto', sans-serif; background-color: var(--light-bg); color: var(--dark-gray); line-height: 1.6; transition: background-color 0.3s ease; }

        .nav-links { display: flex; list-style: none; gap: 25px; align-items: center; }

        nav.scrolled .nav-links a { color: var(--dark-gray); }
        #dark-mode-toggle { background: none; border: none; cursor: pointer; color: var(--white); font-size: 1.1rem; }
        nav.scrolled #dark-mode-toggle { color: var(--navy); }
