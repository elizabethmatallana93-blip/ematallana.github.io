<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elizabeth Matallana | Portfolio</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Montserrat:wght@600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --navy: #001F3F;
            --teal: #008080;
            --white: #FFFFFF;
            --light-bg: #F4F7F6;
            --shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Roboto', sans-serif; background: var(--light-bg); line-height: 1.6; color: #333; }
        h1, h2, h3, h4 { font-family: 'Montserrat', sans-serif; }
        
        /* --- Hero --- */
        .hero { 
            height: 60vh; 
            background: linear-gradient(135deg, #001F3F 0%, #003366 100%); 
            display: flex; align-items: center; justify-content: center; 
            text-align: center; color: white; padding: 20px;
        }

        /* --- Grid-Based Timeline (Prevents Overlap) --- */
        .timeline-section { padding: 80px 10%; max-width: 1200px; margin: 0 auto; }
        .timeline-container { 
            display: grid; 
            grid-template-columns: 1fr; 
            gap: 30px; 
            position: relative;
        }
        /* Vertical line in middle for desktop */
        @media (min-width: 900px) {
            .timeline-container::before {
                content: ''; position: absolute; left: 50%; top: 0; bottom: 0;
                width: 3px; background: #ddd; transform: translateX(-50%);
            }
        }
        .job-card {
            background: var(--white);
            padding: 30px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            position: relative;
            width: 100%;
            border-left: 5px solid var(--teal);
        }
        @media (min-width: 900px) {
            .job-card { width: 45%; }
            .job-card.left { align-self: start; justify-self: start; }
            .job-card.right { align-self: start; justify-self: end; }
        }

        .job-date { color: var(--teal); font-weight: 800; display: block; margin-bottom: 5px; font-size: 0.9rem; }
        .job-title { color: var(--navy); font-size: 1.25rem; margin-bottom: 5px; }
        .job-company { font-weight: 700; font-size: 0.9rem; color: #666; margin-bottom: 10px; display: block; }

        /* --- Showcase Section --- */
        .showcase { background: #fdfdfd; padding: 80px 10%; text-align: center; }
        .showcase-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 40px;
            margin-top: 40px;
        }
        .showcase-item {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: var(--shadow);
            border: 1px solid #eee;
        }
